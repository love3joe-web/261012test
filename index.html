<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>학급 진로 기록함</title>
<style>
/* 학생 화면: 휴대폰 세로 흐름 / 교사 화면: PC 표 중심. 칠판 녹색 + 서늘한 종이 바탕 */
:root{
  --paper:#F2F5F3; --surface:#FFFFFF; --sunk:#E7EDEA; --ink:#17221E; --muted:#56665F; --line:#D5DED9;
  --accent:#1D6A4E; --accent-ink:#FFFFFF; --accent-soft:#DDEDE5;
  --good:#2D7A4C; --good-soft:#E0F0E6; --warn:#9A5512; --warn-soft:#F7EBDD; --bad:#A33B2B; --bad-soft:#F6E2DE;
  --f-display:"Nanum Myeongjo","AppleMyungjo","Batang","Noto Serif KR",serif;
  --f-body:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Consolas,Menlo,monospace;
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#111815; --surface:#18221E; --sunk:#202B26; --ink:#E4ECE8; --muted:#97A7A0; --line:#2C3934;
  --accent:#5CBA91; --accent-ink:#0D1A14; --accent-soft:#1E3A2E;
  --good:#7CCB98; --good-soft:#1C3326; --warn:#E3A867; --warn-soft:#3A2B1A; --bad:#EE8D7C; --bad-soft:#3D2420; color-scheme:dark}}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:0 48px}
[hidden]{display:none!important}
img{max-width:100%}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-size:1.7rem;line-height:1.3;font-weight:800}
h2{font-size:1.05rem;font-weight:700}
h3{font-size:.95rem;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:720px;margin-inline:auto;display:flex;flex-direction:column;gap:18px;padding-top:18px}
.wrap.wide{max-width:1180px}
.topbar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);margin-inline:-16px;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:1.1rem;font-weight:800;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--f-body);font-size:.8rem;font-weight:500;color:var(--muted)}
.spacer{flex:1}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav button{border:0;background:none;padding:6px 12px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:600}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);padding:6px 8px}
.btn.ghost:hover{color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:.85rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel-head h2{flex:1;min-width:0}
.step{font-family:var(--f-mono);font-size:.75rem;color:var(--accent);letter-spacing:.06em;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.notice{background:var(--sunk);border-radius:8px;padding:10px 12px;font-size:.85rem;color:var(--muted)}
.notice.warn{background:var(--warn-soft);color:var(--warn)}
.notice.bad{background:var(--bad-soft);color:var(--bad)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:.8rem;font-weight:700;color:var(--muted);letter-spacing:.02em}
input[type=text],input[type=password],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px}
textarea{min-height:110px;resize:vertical}
input[type=file]{font-size:.85rem;max-width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>.field{flex:1 1 180px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--accent-soft);border-radius:999px;padding:3px 6px 3px 11px;font-size:.85rem}
.chip.plain{padding:3px 11px}
.chip button{border:0;background:none;cursor:pointer;color:var(--muted);padding:0 4px;font-size:1rem;line-height:1}
.tag{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.track{background:var(--accent-soft);color:var(--ink)}
.tag.good{background:var(--good-soft);color:var(--good)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:0}
.item-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.item-main .t{font-weight:700;overflow-wrap:anywhere}
.item-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.item-actions{display:flex;gap:2px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted);font-size:.88rem}
.idcard{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.badge-num{font-family:var(--f-mono);font-size:1.3rem;width:52px;height:52px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex-shrink:0}
.result{display:grid;gap:12px}
.rsec{border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--sunk)}
.rsec h3{display:flex;align-items:center;gap:8px}
.rsec.good h3{color:var(--good)} .rsec.gap h3{color:var(--warn)} .rsec.sug h3{color:var(--accent)}
.rsec ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cmp>div{min-width:0;display:flex;flex-direction:column;gap:10px}
@media (max-width:760px){.cmp{grid-template-columns:1fr}}
.hist{display:flex;flex-direction:column;gap:2px}
.hist-row{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:6px;flex-wrap:wrap}
.hist-row[aria-current="true"]{background:var(--accent-soft)}
.hist-row .d{font-family:var(--f-mono);font-size:.85rem;min-width:96px}
.hist-row .s{flex:1;min-width:0;font-size:.85rem;color:var(--muted)}
.fb{border-left:3px solid var(--accent);padding:6px 0 6px 12px;display:flex;flex-direction:column;gap:4px}
.fb.private{border-left-color:var(--line)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:860px;font-size:.9rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.78rem;color:var(--muted);font-weight:700;letter-spacing:.03em;background:var(--sunk);white-space:nowrap}
th button{border:0;background:none;font:inherit;color:inherit;cursor:pointer;padding:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--sunk)}
tbody tr:last-child td{border-bottom:0}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat .v{font-family:var(--f-mono);font-size:1.4rem;font-variant-numeric:tabular-nums}
.stat .k{font-size:.8rem;color:var(--muted)}
.meter{height:5px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--accent)}
.start{max-width:540px;margin:48px auto 0;display:flex;flex-direction:column;gap:18px}
.start h1{font-size:2.1rem}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:18px;align-items:start}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:.88rem}
.checks input{accent-color:var(--accent)}
.checks label:has(input:checked){background:var(--accent-soft);border-color:var(--accent)}
.toggle{display:inline-flex;gap:6px;align-items:center;font-size:.85rem;cursor:pointer}
.toggle input{accent-color:var(--accent);width:16px;height:16px}
.overlay{position:fixed;inset:0;background:rgb(10 20 16 / .45);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:16px}
@media (min-width:640px){.overlay{align-items:center}}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:620px;max-height:calc(100% - 16px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.modal.big{max-width:920px}
.modal-head{display:flex;align-items:center;gap:10px}
.modal-head h2{flex:1;min-width:0;overflow-wrap:anywhere}
.viewer{display:flex;flex-direction:column;gap:12px}
.viewer img{display:block;border:1px solid var(--line);border-radius:6px;margin-inline:auto}
.viewer iframe{width:100%;height:70vh;border:1px solid var(--line);border-radius:6px;background:#fff}
pre.text{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--sunk);padding:12px;border-radius:8px;font-family:var(--f-body);font-size:.85rem;max-height:360px;overflow:auto;margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:.9rem;z-index:30;max-width:calc(100% - 32px)}
.empty{text-align:center;padding:22px 10px;color:var(--muted);font-size:.9rem;border:1px dashed var(--line);border-radius:8px}
.score{font-family:var(--f-mono);font-size:.75rem}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>

<script>

function checkFile(f){

const readDataURL=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b)});
async function compressImage(f){
  const url=await readDataURL(f);const img=new Image();await new Promise((r,j)=>{img.onload=r;img.onerror=j;img.src=url});
  const max=1600,s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
  const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(r,"image/jpeg",0.82));
}
async function docxText(buf){
  try{
    const u8=new Uint8Array(buf),dv=new DataView(buf);let e=-1;
    for(let i=u8.length-22;i>=Math.max(0,u8.length-65557);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break}}
    if(e<0)return"";
    const cnt=dv.getUint16(e+10,true);let off=dv.getUint32(e+16,true);
    for(let k=0;k<cnt;k++){
      if(dv.getUint32(off,true)!==0x02014b50)break;
      const method=dv.getUint16(off+10,true),csize=dv.getUint32(off+20,true),nlen=dv.getUint16(off+28,true),xlen=dv.getUint16(off+30,true),clen=dv.getUint16(off+32,true),lho=dv.getUint32(off+42,true);
      const name=new TextDecoder().decode(u8.subarray(off+46,off+46+nlen));
      if(name==="word/document.xml"){
        const start=lho+30+dv.getUint16(lho+26,true)+dv.getUint16(lho+28,true);const data=u8.subarray(start,start+csize);let xml;
        if(method===0)xml=new TextDecoder().decode(data);
        else if(method===8&&"DecompressionStream" in window){const out=await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer();xml=new TextDecoder().decode(out)}
        else return"";
        return xml.replace(/<\/w:p>/g,"\n").replace(/<w:tab\/>/g," ").replace(/<w:br\/>/g,"\n").replace(/<[^>]+>/g,"")
          .replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,"&").replace(/\n{3,}/g,"\n\n").trim();
      }
      off+=46+nlen+xlen+clen;
    }
    return"";
  }catch(err){return""}
}
async function storeFile(file){
  const e=extOf(file.name);let blob=file,mime=file.type,text="";
  if(e==="jpg"||e==="jpeg"||e==="png"){blob=await compressImage(file);mime="image/jpeg"}
  else if(e==="pdf"){mime="application/pdf"}
  else{mime="application/vnd.openxmlformats-officedocument.wordprocessingml.document";text=await docxText(await file.arrayBuffer())}
  const id="f_"+rid();
  await FileStore.put(id,{blob,text:text.slice(0,30000)});
  return {id,name:file.name,mime,size:blob.size,hasText:!!text.trim()};
}

   5. 규칙 기반 자동 분석
   ========================================================= */
function majorKeywords(major){
  const out=new Set();const m=String(major||"");
  for(const[re,kws]of MAJOR_KW){if(re.test(m))kws.forEach(k=>out.add(k))}
  const core=m.replace(/(학과|학부|전공|계열|과)$/,"").trim();
  if(core.length>=2){out.add(core);if(core.length>=4){out.add(core.slice(0,2));out.add(core.slice(-2))}}
  return [...out];
}
function refKeywords(track){
  const out=new Set();
  for(const r of DB.refs){if(!(r.tracks||[]).length||(r.tracks||[]).includes(track))(r.keywords||[]).forEach(k=>k&&out.add(k))}
  return [...out];
}
const hits=(text,kws)=>kws.filter(k=>k&&text.toLowerCase().includes(String(k).toLowerCase()));
function depthOf(summary,extra){
  const t=summary+" "+(extra||"");const d=new Set(hits(t,DEPTH_KW));const r=hits(summary,REFLECT_KW);
  let score=Math.min(d.size,5)+(r.length?1:0)+(summary.length>=300?2:summary.length>=150?1:0);
  return {score,depthWords:[...d].slice(0,4),reflect:r.length>0};
}
function copyCheck(summary,ftext){
  if(!ftext||summary.length<40)return false;
  const norm=s=>s.replace(/\s+/g,"");const f=norm(ftext),s=norm(summary);
  let same=0,parts=0;for(let i=0;i+30<=s.length;i+=30){parts++;if(f.includes(s.slice(i,i+30)))same++}
  return parts>0&&same/parts>=0.6;
}
/* 순수 함수: 입력만으로 결과를 만든다 (점검 시 그대로 호출) */
function analyze(input){
  const {no,track,major,subjects,acts,refKw}=input;
  const mk=majorKeywords(major),tk=TRACK_KW[track]||[],rk=refKw||[];
  const recSub=TRACK_SUBJ[track]||[];const mySub=(subjects||[]).map(baseSubj);
  const scored=acts.map(a=>{
    const text=`${a.title} ${a.summary} ${(a.fileText||"").slice(0,4000)}`;
    const hm=hits(text,mk),ht=hits(text,tk),hr=hits(text,rk);
    const subjRec=a.subject&&recSub.includes(baseSubj(a.subject));
    const dep=depthOf(a.summary,(a.fileText||"").slice(0,4000));
    const rel=hm.length*2+ht.length+hr.length*1.5+(subjRec?1:0);
    return {a,hm,ht,hr,subjRec,dep,rel,copied:copyCheck(a.summary,a.fileText)};
  });
  /* 1) 유리한 활동 */
  const good=scored.filter(x=>x.rel>=2&&!x.copied).sort((p,q)=>(q.rel+q.dep.score*0.5)-(p.rel+p.dep.score*0.5)).slice(0,5).map(x=>{
    const why=[];
    const kw=[...new Set([...x.hm,...x.ht,...x.hr])].slice(0,4);
    if(x.hm.length)why.push(`희망 학과와 관련된 '${kw.join(", ")}' 내용이 있습니다`);
    else why.push(`${track} 계열과 관련된 '${kw.join(", ")}' 내용이 있습니다`);
    if(x.subjRec)why.push(`${track} 계열 권장 과목(${baseSubj(x.a.subject)})의 활동입니다`);
    if(x.dep.depthWords.length>=2)why.push(`탐구 과정(${x.dep.depthWords.join("·")})이 드러납니다`);
    if(x.dep.reflect)why.push("활동으로 배운 점과 생각의 변화가 적혀 있습니다");
    return {activity:x.a.title,reason:why.join(". ")+"."};
  });
  /* 2) 부족한 부분 */
  const gaps=[];
  const copied=scored.filter(x=>x.copied);
  copied.forEach(x=>gaps.push({area:"근거 자료",detail:`'${x.a.title}'의 요약이 첨부 파일 문장을 거의 그대로 옮긴 것으로 보입니다. 원문을 붙여 넣은 내용은 학생 능력을 평가할 근거가 되기 어려우니, 직접 한 일과 배운 점을 자기 말로 다시 써 주세요.`,key:"copy"}));
  if(acts.length<3)gaps.push({area:"활동 수",detail:`올린 활동이 ${acts.length}개입니다. 진로와의 연결을 보여 주려면 과목 활동과 창체 활동을 합쳐 3개 이상 쌓는 것이 좋습니다.`,key:"few"});
  const goodN=good.length;
  if(acts.length&&goodN===0)gaps.push({area:"진로 연결",detail:`희망 진로(${track}${major?" · "+major:""})와 직접 이어지는 활동이 아직 보이지 않습니다. 활동 요약에 진로와 어떻게 연결되는지 적거나, 관련 주제로 활동을 해 보세요.`,key:"rel"});
  else if(acts.length>=3&&goodN/acts.length<0.4)gaps.push({area:"진로 연결",detail:`활동 ${acts.length}개 중 진로와 연결이 뚜렷한 활동은 ${goodN}개입니다. 다른 활동에서도 진로와 이어지는 지점을 찾아 요약에 적어 보세요.`,key:"rel"});
  const missSub=recSub.filter(s=>!mySub.includes(s));
  if(missSub.length)gaps.push({area:"과목",detail:`${track} 계열 권장 과목 중 ${missSub.join(", ")}이(가) 이수 과목 목록에 없습니다. 이수 중이라면 목록에 추가하고, 이 과목에서 진로와 연결한 활동을 만들어 보세요.`,key:"sub",subs:missSub});
  const actSubs=new Set(acts.filter(a=>a.subject).map(a=>baseSubj(a.subject)));
  const noActSub=recSub.filter(s=>mySub.includes(s)&&!actSubs.has(s));
  if(noActSub.length&&acts.length)gaps.push({area:"과목 활동",detail:`권장 과목 ${noActSub.slice(0,3).join(", ")}에서 진로와 연결한 수행평가·보고서 기록이 없습니다.`,key:"subact",subs:noActSub});
  const types=new Set(acts.map(a=>a.type));
  const noCareer=!types.has("창체 · 진로"),noReport=!types.has("보고서");
  if(acts.length&&(noCareer||noReport))gaps.push({area:"활동 유형",key:"types",noCareer,noReport,
    detail:[noReport?"보고서 형태의 탐구 기록이 없습니다. 궁금한 점을 정해 자료를 찾고 결론까지 정리한 보고서는 탐구 깊이를 보여 주기 좋습니다.":"",
      noCareer?"창의적 체험활동(진로) 기록이 없습니다. 진로 탐색 활동이나 학과 탐방 기록을 남겨 보세요.":""].filter(Boolean).join(" ")});
  const avgDepth=scored.length?scored.reduce((s,x)=>s+x.dep.score,0)/scored.length:0;
  if(acts.length&&avgDepth<3)gaps.push({area:"탐구 깊이",detail:"활동 요약에 무엇을 조사·분석했는지, 결과와 한계는 무엇이었는지가 잘 드러나지 않습니다. 과정과 배운 점을 구체적으로 적어 보세요.",key:"depth"});
  if(rk.length){const all=scored.map(x=>`${x.a.title} ${x.a.summary} ${x.a.fileText||""}`).join(" ");const miss=rk.filter(k=>!hits(all,[k]).length).slice(0,3);
    if(miss.length&&acts.length)gaps.push({area:"권장 요소",detail:`${track} 계열에서 중요하게 보는 '${miss.join(", ")}' 관련 활동이 아직 없습니다.`,key:"ref",kws:miss})}
  const order=["copy","rel","few","depth","ref","subact","types","sub"];
  gaps.sort((p,q)=>order.indexOf(p.key)-order.indexOf(q.key));
  const topGaps=gaps.slice(0,5);
  /* 3) 보완 제안 */
  const sug=[];
  for(const g of topGaps){
    if(g.key==="copy")sug.push({title:"요약을 내 말로 다시 쓰기",detail:"'무엇을 했는가 → 무엇을 알게 되었는가 → 진로와 어떻게 이어지는가' 순서로 3~5문장을 직접 써 보세요."});
    if(g.key==="depth")sug.push({title:"탐구 과정 기록 습관",detail:"활동마다 질문, 방법, 결과, 한계, 다음에 해 볼 것을 한 줄씩 적어 두면 탐구 깊이가 드러납니다."});
    if(g.key==="subact")sug.push({title:`${g.subs[0]} 수업과 진로 연결`,detail:`${g.subs[0]} 시간에 배운 개념 하나를 골라 ${major||track+" 계열"}과 연결한 짧은 탐구 보고서를 써 보세요.`});
    if(g.key==="types"&&g.noCareer)sug.push({title:"진로 탐색 기록 남기기",detail:`${major||track+" 계열"} 관련 학과 탐방, 전공 강의 시청, 직업인 인터뷰 중 하나를 하고 느낀 점을 창체(진로)로 올려 보세요.`});
    if(g.key==="ref")sug.push({title:`'${g.kws[0]}' 주제 활동`,detail:`'${g.kws.join(", ")}' 중 하나를 주제로 수행평가나 동아리 활동을 계획해 보세요.`});
    if(g.key==="rel")sug.push({title:"진로 연결 문장 넣기",detail:"이미 한 활동의 요약 끝에 '이 활동이 내 희망 진로와 어떻게 이어지는지' 한두 문장을 덧붙여 보세요."});
  }
  (TRACK_IDEAS[track]||[]).forEach(t=>sug.push({title:`${track} 계열 추천 활동`,detail:t}));
  if(major)sug.push({title:"전공 관련 독서",detail:`${major}과 관련된 교양서 한 권을 읽고, 수업에서 배운 내용과 연결한 탐구 질문을 세워 보세요.`});
  const seen=new Set();const suggestions=sug.filter(s=>{const k=s.title+s.detail;if(seen.has(k))return false;seen.add(k);return true}).slice(0,4);
  const gapSummary=topGaps.length?[...new Set(topGaps.map(g=>g.area))].slice(0,2).join("·")+" 보완 필요":"큰 부족 영역 없음";
  return {no,track,major,subjects:subjects||[],actCount:acts.length,
    good,gaps:topGaps.map(g=>({area:g.area,detail:g.detail})),suggestions,gapSummary,
    scores:scored.map(x=>({title:x.a.title,rel:Math.round(x.rel*10)/10,depth:x.dep.score}))};

async function runAnalysis(no,by){
  const st=stu(no),acts=actsOf(no);
  if(!st.track){toast("희망 계열을 먼저 입력해 주세요.");return}
  if(!acts.length){toast("활동을 1개 이상 올린 뒤 분석해 주세요.");return}
  const withText=await Promise.all(acts.map(async a=>({title:a.title,type:a.type,subject:a.subject,summary:a.summary,fileText:await fileText(a.file)})));
  const r=analyze({no,track:st.track,major:st.major||"",subjects:st.subjects||[],acts:withText,refKw:refKeywords(st.track)});
  r.id="a_"+rid();r.createdAt=now();r.by=by;r.refCount=DB.refs.filter(x=>!(x.tracks||[]).length||(x.tracks||[]).includes(st.track)).length;
  DB.analyses.push(r);save();S.sel[no]={view:r.id};render();toast("분석을 마쳤습니다.");
}

function render(){

  const fid=document.activeElement&&app.contains(document.activeElement)?document.activeElement.id:null;
  app.innerHTML=S.view==="student"?studentView():S.view==="teacher"?teacherView():startView();
  for(const[id,v]of Object.entries(saved)){const el=document.getElementById(id);if(!el)continue;if(el.type==="checkbox")el.checked=v;else el.value=v}

}

async function viewFile(src,id){
  const rec=src==="ref"?DB.refs.find(r=>r.id===id):DB.acts.find(a=>a.id===id);if(!rec||!rec.file)return;const m=rec.file;
  let data;try{data=await FileStore.get(m.id)}catch(e){}
  if(!data){openModal(`<div class="modal-head"><h2>${esc(m.name)}</h2><button class="btn ghost" data-a="modal-close">닫기</button></div><div class="notice bad">이 기기에서 파일을 찾을 수 없습니다. 다른 기기에서 올린 파일이라면 내보내기·가져오기로 옮겨 주세요.</div>`);return}
  const url=URL.createObjectURL(data.blob);
  let inner;
  if(m.mime.startsWith("image/"))inner=`<img src="${url}" alt="${esc(m.name)}">`;
  else if(m.mime==="application/pdf")inner=`<iframe src="${url}" title="${esc(m.name)}"></iframe><p class="small muted">미리보기가 보이지 않으면 [원본 저장]으로 내려받아 열어 주세요.</p>`;
  else inner=data.text?`<div class="lbl">문서 내용</div><pre class="text">${esc(data.text)}</pre>`:`<p class="muted">글자를 읽지 못했습니다. [원본 저장]으로 내려받아 열어 주세요.</p>`;
  let name=m.name;if(m.mime==="image/jpeg"&&!/\.jpe?g$/i.test(name))name=name.replace(/\.[^.]+$/,"")+".jpg";
  openModal(`<div class="modal-head"><h2>${esc(m.name)}</h2><a class="btn" href="${url}" download="${esc(name)}" data-url="${url}">원본 저장</a><button class="btn ghost" data-a="modal-close">닫기</button></div><div class="viewer">${inner}</div>`,true);
}

async function packFiles(metas){
  const out={};for(const m of metas){if(!m)continue;try{const d=await FileStore.get(m.id);if(d)out[m.id]={dataUrl:await readDataURL(d.blob),text:d.text||""}}catch(e){}}return out;
}
function dataUrlToBlob(u){const i=u.indexOf(",");const mime=(u.slice(5,i).split(";")[0])||"application/octet-stream";const bin=atob(u.slice(i+1));const a=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)a[k]=bin.charCodeAt(k);return new Blob([a],{type:mime})}
async function exportStudent(){
  const no=S.me,acts=actsOf(no);
  const pack={kind:"class-career-student",version:1,exportedAt:now(),no,name:nameOf(no),student:stu(no),acts,files:await packFiles(acts.map(a=>a.file))};
  download(`${DB.roster.label||"학급"}_${no}번_진로자료_${stamp()}.json`.replace(/\s+/g,""),JSON.stringify(pack));
  toast("내 자료 파일을 저장했습니다. 이 파일을 선생님께 보내 주세요.");
}
async function exportAll(){
  const metas=[...DB.acts.map(a=>a.file),...DB.refs.map(r=>r.file)];
  const pack={kind:"class-career-backup",version:1,exportedAt:now(),state:DB,files:await packFiles(metas)};
  download(`학급진로기록함_전체백업_${stamp()}.json`,JSON.stringify(pack));toast("전체 백업 파일을 저장했습니다.");
}
async function restoreFiles(files){for(const[id,f]of Object.entries(files||{})){try{await FileStore.put(id,{blob:dataUrlToBlob(f.dataUrl),text:f.text||""})}catch(e){}}}
async function importStudentPack(p){
  const no=Number(p.no);if(!Number.isInteger(no))throw new Error("번호가 없는 파일입니다");
  for(const a of DB.acts.filter(a=>a.no===no))if(a.file&&!(p.files||{})[a.file.id])await removeFile(a.file);
  DB.acts=DB.acts.filter(a=>a.no!==no).concat((p.acts||[]).map(a=>({...a,no})));
  DB.students[no]={...(p.student||{}),no};
  if(!DB.roster.students.some(s=>s.no===no)){DB.roster.students.push({no,name:p.name||""});DB.roster.students.sort((a,b)=>a.no-b.no)}
  await restoreFiles(p.files);
  return `${no}번(활동 ${(p.acts||[]).length}개)`;
}
let pendingImport=null;
async function startImport(){
  const inp=document.getElementById("imp-file");const files=[...(inp&&inp.files||[])];if(!files.length){toast("가져올 파일을 골라 주세요.");return}
  const packs=[];
  for(const f of files){try{const p=JSON.parse(await f.text());if(p.kind==="class-career-student"||p.kind==="class-career-backup")packs.push(p);else throw 0}catch(e){toast(`${f.name}: 이 앱에서 만든 파일이 아닙니다.`);return}}
  const backup=packs.find(p=>p.kind==="class-career-backup");
  if(backup&&packs.length>1){toast("전체 백업 파일은 한 번에 하나만 가져올 수 있습니다.");return}
  pendingImport=packs;
  if(backup)confirmModal(`전체 백업(${fmt(backup.exportedAt)})으로 이 기기의 데이터를 모두 바꿉니다. 계속할까요?`,"import-ok","","바꾸기");
  else confirmModal(`학생 자료 ${packs.length}개(${packs.map(p=>p.no+"번").join(", ")})를 가져옵니다. 같은 번호의 기존 활동은 가져온 내용으로 바뀝니다.`,"import-ok","","가져오기");
}
async function finishImport(){
  const packs=pendingImport;pendingImport=null;if(!packs)return;
  if(packs[0].kind==="class-career-backup"){await FileStore.clear().catch(()=>{});DB=Object.assign(emptyState(),packs[0].state);await restoreFiles(packs[0].files);save();toast("전체 백업을 불러왔습니다.");}
  else{const done=[];for(const p of packs)done.push(await importStudentPack(p));save();toast(`가져왔습니다: ${done.join(", ")}`)}
  render();
}

async function saveAct(id){
  const g=x=>document.getElementById(x),err=g("m-err"),prog=g("m-prog"),btn=g("m-save");
  const showErr=m=>{err.textContent=m;err.hidden=false};err.hidden=true;
  const type=g("m-type").value,subject=NEEDS_SUBJECT(type)?g("m-subj").value:"",title=g("m-title").value.trim(),summary=g("m-sum").value.trim(),file=g("m-file").files[0];
  if(NEEDS_SUBJECT(type)&&!subject)return showErr("관련 과목을 골라 주세요.");
  if(!title)return showErr("활동명을 적어 주세요.");
  if(summary.length<20)return showErr("활동 내용 요약을 20자 이상 직접 써 주세요.");
  if(file){const m=checkFile(file);if(m)return showErr(m)}
  btn.disabled=true;
  try{
    const old=id?DB.acts.find(a=>a.id===id):null;let fileMeta=old?old.file||null:null;
    if(file){prog.textContent="파일 저장 중…";const nm=await storeFile(file);if(fileMeta)await removeFile(fileMeta);fileMeta=nm}
    else if(fileMeta&&g("m-file-del")&&g("m-file-del").checked){await removeFile(fileMeta);fileMeta=null}
    const body={id:id||"act_"+rid(),no:S.me,type,subject,title,summary,file:fileMeta,createdAt:old?old.createdAt:now(),updatedAt:now()};
    if(old)Object.assign(old,body);else DB.acts.push(body);
    if(!save())throw new Error("save");
    closeModal();render();toast(id?"활동을 수정했습니다.":"활동을 추가했습니다.");
  }catch(e){showErr("저장하지 못했습니다. 파일이 너무 크거나 브라우저 저장 공간이 부족할 수 있습니다.");btn.disabled=false;prog.textContent=""}
}

    case "edit-career":careerModal();return;
    case "career-save":{const track=document.getElementById("m-track").value,major=document.getElementById("m-major").value.trim();if(!track){toast("계열을 골라 주세요.");return}saveStudent({track,major});closeModal();render();toast("희망 진로를 저장했습니다.");return}
    case "sub-del":saveStudent({subjects:(stu(S.me).subjects||[]).filter(s=>s!==d.v)});render();return;
    case "act-new":actModal(null);return;
    case "act-edit":actModal(d.id);return;
    case "act-save":saveAct(d.id||null);return;
    case "act-del":confirmModal("이 활동과 첨부 파일을 삭제할까요?","act-del-ok",`data-id="${d.id}"`);return;
    case "act-del-ok":{const x=DB.acts.find(q=>q.id===d.id);closeModal();if(x){DB.acts=DB.acts.filter(q=>q!==x);save();await removeFile(x.file);render();toast("활동을 삭제했습니다.")}return}
    case "analyze":runAnalysis(Number(d.no),d.by==="teacher"?"teacher":"student");return;
    case "ana-view":S.sel[d.no]={view:d.id};render();return;
    case "ana-cmp":{const s=S.sel[d.no]||{};S.sel[d.no]={view:s.view||anaOf(Number(d.no))[0].id,compare:s.compare===d.id?null:d.id};render();return}
    case "export-student":exportStudent();return;
    case "file-view":viewFile(d.src,d.id);return;
    case "tab":S.tab=d.v;render();window.scrollTo(0,0);return;
    case "detail":S.tab="detail";S.detailNo=Number(d.no);render();window.scrollTo(0,0);return;
    case "sort":S.filter.dir=S.filter.sort===d.v?-S.filter.dir:1;S.filter.sort=d.v;render();return;
    case "fb-add":{const no=Number(d.no),ta=document.getElementById("fb-text-"+no),pub=document.getElementById("fb-pub-"+no);const text=ta.value.trim();if(!text){toast("피드백 내용을 적어 주세요.");return}
      const isPub=pub.checked;DB.fb.push({id:"fb_"+rid(),no,text,public:isPub,createdAt:now()});save();ta.value="";pub.checked=false;render();toast(isPub?"피드백을 저장하고 학생에게 공개했습니다.":"상담 메모로 저장했습니다.");return}
    case "fb-toggle":{const f=DB.fb.find(x=>x.id===d.id);if(f){f.public=!f.public;save();render();toast(f.public?"학생에게 공개했습니다.":"비공개 상담 메모로 바꿨습니다.")}return}
    case "fb-del":confirmModal("이 피드백을 삭제할까요?","fb-del-ok",`data-id="${d.id}"`);return;
    case "fb-del-ok":DB.fb=DB.fb.filter(f=>f.id!==d.id);save();closeModal();render();toast("피드백을 삭제했습니다.");return;
    case "ref-add":{const title=document.getElementById("ref-title").value.trim(),fi=document.getElementById("ref-file"),f=fi.files[0];
      const tracks=TRACKS.filter(x=>document.getElementById("ref-t-"+x).checked);
      const keywords=document.getElementById("ref-kw").value.split(/[,，、]/).map(s=>s.trim()).filter(Boolean);
      if(!title){toast("제목을 적어 주세요.");return}if(f){const m=checkFile(f);if(m){toast(m);return}}
      if(!f&&!keywords.length){toast("파일이나 핵심어 중 하나는 넣어 주세요.");return}
      t.disabled=true;
      try{const meta=f?await storeFile(f):null;DB.refs.push({id:"ref_"+rid(),title,tracks,keywords,file:meta,createdAt:now()});save();
        ["ref-title","ref-kw"].forEach(x=>document.getElementById(x).value="");fi.value="";TRACKS.forEach(x=>document.getElementById("ref-t-"+x).checked=false);
        render();toast(keywords.length?"참고자료를 올렸습니다.":"올렸습니다. 핵심어를 넣어야 분석에 반영됩니다.")}
      catch(e){toast("파일을 저장하지 못했습니다.");t.disabled=false}return}
    case "ref-del":confirmModal("이 참고자료를 삭제할까요?","ref-del-ok",`data-id="${d.id}"`);return;
    case "ref-del-ok":{const r=DB.refs.find(x=>x.id===d.id);closeModal();if(r){DB.refs=DB.refs.filter(x=>x!==r);save();await removeFile(r.file);render();toast("참고자료를 삭제했습니다.")}return}
    case "subj-add":{const inp=document.getElementById("sub-new"),v=inp.value.trim();if(!v)return;if(DB.subjects.includes(v)){toast("이미 있는 과목입니다.");return}DB.subjects.push(v);save();inp.value="";render();return}
    case "subj-save":{const i=Number(d.i),v=document.getElementById("subj-"+i).value.trim();if(!v)return;DB.subjects[i]=v;save();render();toast("저장했습니다.");return}
    case "subj-del":DB.subjects.splice(Number(d.i),1);save();render();return;
    case "subj-reset":DB.subjects=DEFAULT_SUBJECTS.slice();save();render();toast("기본 목록으로 되돌렸습니다.");return;
    case "roster-save":{const lines=document.getElementById("ros-text").value.split("\n").map(s=>s.trim()).filter(Boolean);const out=[],bad=[];
      for(const ln of lines){const m=ln.match(/^(\d{1,2})\s*(?:번)?[\s.,:\-\t]*(.+)$/);if(m&&m[2].trim())out.push({no:Number(m[1]),name:m[2].trim()});else bad.push(ln)}
      if(bad.length){toast(`형식이 맞지 않는 줄: ${bad[0]}`);return}
      const nos=out.map(s=>s.no);if(new Set(nos).size!==nos.length){toast("번호가 겹치는 학생이 있습니다.");return}
      out.sort((a,b)=>a.no-b.no);DB.roster={label:document.getElementById("ros-label").value.trim(),students:out};save();render();toast(`${out.length}명 명단을 저장했습니다.`);return}
    case "import":startImport();return;
    case "import-ok":closeModal();finishImport();return;
    case "export-all":exportAll();return;
    case "wipe":confirmModal("이 기기에 저장된 명단, 학생 기록, 피드백, 참고자료, 첨부 파일을 모두 지웁니다. 되돌릴 수 없습니다.","wipe-ok","","모두 지우기");return;
    case "wipe-ok":closeModal();await FileStore.clear().catch(()=>{});DB=emptyState();save();S.view="start";render();toast("모든 데이터를 지웠습니다.");return;
  }
});
document.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.id==="sub-add"&&t.value){const v=t.value;saveStudent({subjects:[...(stu(S.me).subjects||[]),v]});render();return}
  if(t.id==="m-type"){document.getElementById("m-subj-wrap").hidden=!NEEDS_SUBJECT(t.value);return}
  if(t.dataset.a==="filter"){S.filter[t.dataset.k]=t.value;render();return}
});
document.addEventListener("keydown",ev=>{
  if(ev.key==="Escape"&&modalEl.innerHTML)closeModal();
  if(ev.key==="Enter"&&ev.target.id==="pin-in")document.querySelector('[data-a="pin-check"]').click();
  if(ev.key==="Enter"&&ev.target.matches("tr[data-a='detail']")){S.tab="detail";S.detailNo=Number(ev.target.dataset.no);render()}
});

/* =========================================================
   10. 시작
   ========================================================= */
(async function boot(){
  try{await FileStore.open();S.fileOk=true}catch(e){S.fileOk=false}
  try{if(!localStorage.getItem(STORE_KEY))save()}catch(e){toast("이 브라우저에서는 저장 기능을 쓸 수 없습니다. 다른 브라우저로 열어 주세요.")}
  render();
})();
</script>
</body>
</html>
